<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F5F9FA">
<title>Viver Odonto · prévia reservada</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23263868'/%3E%3Cpath d='M23 14c-6 0-9 5-9 11 0 5 2 8 3 12 2 6 2 15 6 15 3 0 3-10 6-10h6c3 0 3 10 6 10 4 0 4-9 6-15 1-4 3-7 3-12 0-6-3-11-9-11-4 0-6 2-9 2s-5-2-9-2z' fill='%23F5F9FA'/%3E%3C/svg%3E">
<link rel="preload" href="titulo.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(titulo.woff2) format("woff2");font-weight:500 800;font-display:swap}
:root{--fundo:#F5F9FA;--branco:#FFFFFF;--marinho:#263868;--agua:#0E8F84;--texto:#1F2937;--apoio:#5B6478;--fio:#D8E1E6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fundo);color:var(--texto);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.portao{min-height:100%;display:grid;place-items:center;padding:32px 16px}
.cartao{width:min(440px,100%);text-align:center;background:var(--branco);border:1px solid var(--fio);border-radius:20px;
  padding:36px 28px 26px;box-shadow:0 1px 2px rgba(38,56,104,.06),0 12px 32px -12px rgba(38,56,104,.18)}
.dente{width:72px;height:72px;margin:0 auto 18px;display:block}
.dente .pulso{stroke-dasharray:90;stroke-dashoffset:90;animation:pulso 2.4s ease-out .3s infinite}
@keyframes pulso{0%{stroke-dashoffset:90}55%{stroke-dashoffset:0}100%{stroke-dashoffset:-90}}
h1{font:800 32px/1.08 "Bricolage Grotesque",system-ui,sans-serif;color:var(--marinho);margin:0 0 8px;letter-spacing:-.015em}
.sub{color:var(--apoio);margin:0 0 26px;text-wrap:balance}
form{display:grid;gap:12px}
input[type=password]{width:100%;height:52px;border-radius:12px;border:1.5px solid var(--fio);background:var(--fundo);color:var(--texto);
  font-size:17px;padding:0 16px;text-align:center;letter-spacing:.04em}
input[type=password]:focus{outline:none;border-color:var(--agua);box-shadow:0 0 0 3px rgba(14,143,132,.16)}
button{height:52px;border:0;border-radius:12px;background:var(--marinho);color:#fff;font-weight:700;font-size:16px;cursor:pointer;
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 6px 16px -8px rgba(38,56,104,.6);transition:transform .15s,background .15s}
button:hover{background:#1E2D55;transform:translateY(-1px)}
button:disabled{opacity:.6;cursor:default;transform:none}
.lembrar{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--apoio);font-size:14px}
.lembrar input{accent-color:var(--agua);width:16px;height:16px}
.msg{min-height:22px;margin:0;font-size:14px;color:var(--apoio)}
.msg.erro{color:#B23A3A}
.barra{height:3px;background:var(--fio);border-radius:3px;overflow:hidden;opacity:0;transition:opacity .2s}
.barra.ativa{opacity:1}
.barra i{display:block;height:100%;width:0;background:var(--agua);transition:width .2s}
.selo{margin:12px 0 0;padding-top:16px;border-top:1px solid var(--fio);font-size:12.5px;color:var(--apoio)}
@media (max-width:420px){.cartao{padding:30px 20px 22px}h1{font-size:29px}}
</style>
</head>
<body>
<main class="portao">
  <div class="cartao">
    <svg class="dente" viewBox="0 0 72 72" aria-hidden="true">
      <path d="M25 9c-7 0-11 6-11 13 0 6 2 10 4 14 2 7 2 19 8 19 4 0 4-12 8-12h4c4 0 4 12 8 12 6 0 6-12 8-19 2-4 4-8 4-14 0-7-4-13-11-13-5 0-7 3-11 3s-6-3-11-3z" fill="#fff" stroke="#263868" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M22 18c2-3 5-4 8-3" fill="none" stroke="#D8E1E6" stroke-width="2.6" stroke-linecap="round"/>
      <path class="pulso" d="M4 65h18l4-7 6 12 5-9 3 4h28" fill="none" stroke="#0E8F84" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Viver Odonto</h1>
    <p class="sub">Prévia reservada do novo site.<br>Digite a senha que você recebeu.</p>
    <form id="f" autocomplete="off">
      <input id="senha" type="password" placeholder="Senha" aria-label="Senha" required>
      <button id="b" type="submit">Abrir a prévia</button>
      <label class="lembrar"><input id="lembrar" type="checkbox" checked> Lembrar neste aparelho</label>
      <div class="barra" aria-hidden="true"><i id="p"></i></div>
      <p class="msg" id="m" role="status"></p>
    </form>
    <p class="selo">Estudo de redesign · não é o site oficial</p>
  </div>
</main>
<script>
(function () {
  var VOLTAS = 310000, CHAVE = "viver-odonto-previa-senha";
  var f = document.getElementById("f"), campo = document.getElementById("senha"), botao = document.getElementById("b");
  var msg = document.getElementById("m"), barra = document.getElementById("p"), lembrar = document.getElementById("lembrar");
  var conteudo = null;
  // baixa o conteúdo cifrado enquanto a pessoa digita a senha
  function baixar() {
    if (conteudo) { return conteudo; }
    barra.parentNode.classList.add("ativa");   // a barra só aparece enquanto baixa
    conteudo = fetch("conteudo.bin").then(function (r) {
      if (!r.ok || !r.body) { return r.arrayBuffer(); }
      var total = +r.headers.get("content-length") || 0, lido = 0, partes = [], leitor = r.body.getReader();
      function passo() {
        return leitor.read().then(function (x) {
          if (x.done) { return new Blob(partes).arrayBuffer(); }
          partes.push(x.value); lido += x.value.length;
          if (total) { barra.style.width = Math.min(100, lido / total * 100).toFixed(0) + "%"; }
          return passo();
        });
      }
      return passo();
    });
    return conteudo;
  }
  function abrir(senha) {
    botao.disabled = true; msg.className = "msg"; msg.textContent = "Abrindo a prévia…";
    return baixar().then(function (buf) {
      var b = new Uint8Array(buf), sal = b.slice(0, 16), iv = b.slice(16, 28), dados = b.slice(28);
      return crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]).then(function (base) {
        return crypto.subtle.deriveKey({ name: "PBKDF2", salt: sal, iterations: VOLTAS, hash: "SHA-256" }, base,
          { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      }).then(function (chave) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, chave, dados);
      });
    }).then(function (claro) {
      try { if (lembrar.checked) { localStorage.setItem(CHAVE, senha); } } catch (e) { /* navegador sem armazenamento */ }
      var fluxo = new Blob([claro]).stream().pipeThrough(new DecompressionStream("gzip"));
      return new Response(fluxo).text();
    }).then(function (html) {
      document.open(); document.write(html); document.close();
    }).catch(function () {
      try { localStorage.removeItem(CHAVE); } catch (e) { /* sem armazenamento */ }
      botao.disabled = false; msg.className = "msg erro"; msg.textContent = "Senha não confere. Tente de novo.";
      campo.select();
    });
  }
  f.addEventListener("submit", function (e) { e.preventDefault(); if (campo.value) { abrir(campo.value.trim()); } });
  campo.addEventListener("input", baixar, { once: true });
  var guardada = null;
  try { guardada = localStorage.getItem(CHAVE); } catch (e) { /* sem armazenamento */ }
  if (guardada) { abrir(guardada); } else { campo.focus(); }
})();
</script>
</body>
</html>
